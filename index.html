<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#132215">
  <title>Maraluxe Resort &amp; Spa — Bar &amp; Restaurant Menu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-paper: #F6F1E6;
      --bg-card: #EFE8D8;
      --forest: #132215;
      --forest-soft: #1D3120;
      --ink: #1A2419;
      --muted: #646E60;
      --gold: #A67C37;
      --gold-bright: #D4B06A;
      --line: #D6CCB8;
      --leader: #C5B9A1;
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --bg-paper: #0F1710;
      --bg-card: #162118;
      --forest: #0B120C;
      --forest-soft: #1B2A1D;
      --ink: #EFE8D6;
      --muted: #9BA696;
      --gold: #D4B06A;
      --gold-bright: #E5C687;
      --line: #283627;
      --leader: #334432;
      color-scheme: dark;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 140px;
    }

    body {
      margin: 0;
      background: var(--bg-paper);
      color: var(--ink);
      font: 400 15.5px/1.5 'Jost', system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Royal Header */
    .site-header {
      background: var(--forest);
      color: #EFE8D6;
      text-align: center;
      padding: calc(env(safe-area-inset-top, 0px) + 22px) 20px 18px;
      border-bottom: 2px solid var(--gold);
      position: relative;
    }

    .theme-toggle {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 16px;
      background: rgba(212, 176, 106, 0.12);
      border: 1px solid rgba(212, 176, 106, 0.4);
      color: var(--gold-bright);
      padding: 6px 11px;
      border-radius: 4px;
      font: 500 11px/1 'Jost', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .brand-crest {
      width: 68px;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }

    .brand-title {
      font: 600 clamp(26px, 6vw, 36px)/1.05 'Cormorant Garamond', Georgia, serif;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #F6F1E6;
      margin: 0;
    }

    .brand-subtitle {
      font: 500 11px/1.2 'Jost', sans-serif;
      letter-spacing: 0.34em;
      text-transform: uppercase;
      color: var(--gold-bright);
      margin: 5px 0 12px;
    }

    .menu-kicker {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      font: italic 600 20px/1 'Cormorant Garamond', Georgia, serif;
      color: var(--gold-bright);
      margin: 0;
    }

    .menu-kicker::before,
    .menu-kicker::after {
      content: "";
      width: 36px;
      height: 1px;
      background: var(--gold-bright);
      opacity: 0.65;
    }

    .brand-motto {
      margin: 8px 0 16px;
      font-size: 10.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #A9B4A4;
    }

    /* Primary Menu Mode Switcher (Bar vs Restaurant) */
    .mode-switcher {
      display: inline-grid;
      grid-template-columns: 1fr 1fr;
      background: rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(212, 176, 106, 0.45);
      border-radius: 5px;
      padding: 3px;
      width: min(100%, 380px);
    }

    .mode-btn {
      background: transparent;
      border: 0;
      color: #CFD6C3;
      padding: 9px 14px;
      border-radius: 3px;
      font: 600 12px/1.1 'Jost', sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--gold-bright);
      color: #132215;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
    }

    /* Sticky Search & Category Bar */
    .sticky-nav {
      position: sticky;
      top: 0;
      z-index: 15;
      background: var(--forest);
      padding: 10px 16px 12px;
      border-bottom: 1px solid rgba(212, 176, 106, 0.3);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .nav-inner {
      max-width: 820px;
      margin: 0 auto;
    }

    .search-wrap {
      position: relative;
    }

    #q {
      width: 100%;
      padding: 10px 36px 10px 14px;
      border-radius: 4px;
      border: 1px solid rgba(212, 176, 106, 0.35);
      background: rgba(255, 255, 255, 0.05);
      color: #F6F1E6;
      font: 400 14.5px 'Jost', sans-serif;
      outline: none;
    }

    #q:focus {
      border-color: var(--gold-bright);
      background: rgba(255, 255, 255, 0.09);
    }

    #q::placeholder {
      color: #8E9A89;
    }

    #chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      margin-top: 10px;
      scrollbar-width: none;
    }

    #chips::-webkit-scrollbar {
      display: none;
    }

    #chips button {
      flex: none;
      padding: 6px 14px;
      border-radius: 3px;
      border: 1px solid rgba(212, 176, 106, 0.3);
      background: transparent;
      color: #D2D9CC;
      font: 500 11.5px 'Jost', sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.18s ease;
    }

    #chips button.on {
      background: var(--gold-bright);
      border-color: var(--gold-bright);
      color: #132215;
      font-weight: 600;
    }

    /* Editorial Page Frame (Matches PDF Double Border) */
    .page-frame {
      max-width: 820px;
      margin: 18px auto 28px;
      padding: 0 12px;
    }

    .ornate-sheet {
      border: 1px solid var(--gold);
      padding: 4px;
      background: var(--bg-paper);
    }

    .ornate-inner {
      border: 1px solid var(--line);
      padding: 18px 18px 32px;
    }

    /* Signature Cocktails Showcase */
    .sig-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 14px;
      margin-top: 14px;
    }

    .sig-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px;
      background: var(--bg-card);
      border: 1px solid var(--line);
      border-left: 3px solid var(--gold);
      border-radius: 4px;
      cursor: zoom-in;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .sig-card:hover {
      transform: translateY(-1px);
      border-color: var(--gold);
    }

    .sig-card img {
      width: 68px;
      height: 68px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--gold);
      flex: none;
    }

    .sig-meta {
      min-width: 0;
      flex: 1;
    }

    .sig-badge {
      display: inline-block;
      font-size: 9.5px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--gold);
      font-weight: 600;
    }

    .sig-name {
      display: block;
      font: 600 19px/1.15 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
      margin-top: 2px;
    }

    .sig-price {
      display: block;
      margin-top: 4px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--gold);
    }

    /* Section & PDF-Style Category Banners */
    .grp {
      margin-top: 34px;
    }

    .grp:first-child {
      margin-top: 6px;
    }

    .grp-header {
      text-align: center;
      margin-bottom: 14px;
    }

    h2.g {
      font: 600 clamp(28px, 5vw, 36px)/1.1 'Cormorant Garamond', Georgia, serif;
      color: var(--gold);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin: 0;
    }

    .grp-rule {
      width: 64px;
      height: 2px;
      background: var(--gold);
      margin: 6px auto 0;
    }

    /* Solid Deep Green Bar from MARALUXE MENU.pdf */
    .cat-banner {
      background: var(--forest-soft);
      color: var(--gold-bright);
      padding: 7px 14px;
      margin: 22px 0 8px;
      font: 600 11.5px/1.2 'Jost', sans-serif;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      border-left: 3px solid var(--gold-bright);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .cat-banner span.currency-hint {
      font-size: 10px;
      letter-spacing: 0.14em;
      opacity: 0.8;
      font-weight: 400;
      flex: none;
    }

    .cat-note {
      margin: -2px 0 8px;
      padding: 0 4px;
      font: italic 14px/1.4 'Cormorant Garamond', Georgia, serif;
      color: var(--muted);
    }

    /* Menu Item Rows with Dotted Leaders */
    .it {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 10px 4px;
      border-bottom: 1px solid rgba(166, 124, 55, 0.16);
    }

    .it:last-child {
      border-bottom: none;
    }

    .it-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .th {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--gold);
      flex: none;
      cursor: zoom-in;
    }

    .nm-wrap {
      min-width: 0;
    }

    .nm {
      font: 600 18.5px/1.25 'Cormorant Garamond', Georgia, serif;
      color: var(--ink);
    }

    .tag {
      display: inline-block;
      margin-left: 8px;
      padding: 1px 7px;
      border: 1px solid var(--gold);
      border-radius: 2px;
      color: var(--gold);
      font: 600 9.5px/1.4 'Jost', sans-serif;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      vertical-align: middle;
    }

    .ds {
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.42;
    }

    .dots {
      flex: 1;
      border-bottom: 1px dotted var(--leader);
      margin: 0 6px;
      min-width: 16px;
      align-self: baseline;
      position: relative;
      top: -4px;
    }

    .pr {
      text-align: right;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      flex: none;
    }

    .pr-row {
      display: inline-flex;
      align-items: baseline;
      justify-content: flex-end;
      gap: 8px;
      margin-left: 14px;
    }

    @media (max-width: 560px) {
      .pr {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 2px;
      }
      .pr-row {
        margin-left: 0;
      }
    }

    .pr-label {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .pr-val {
      font-weight: 600;
      font-size: 14.5px;
      color: var(--ink);
    }

    .none {
      padding: 42px 16px;
      text-align: center;
      color: var(--muted);
      font: italic 20px 'Cormorant Garamond', Georgia, serif;
    }

    .cross-switch-btn {
      display: inline-block;
      margin-top: 14px;
      padding: 9px 18px;
      background: var(--gold);
      color: #FFFFFF;
      border: 0;
      border-radius: 4px;
      font: 600 12px 'Jost', sans-serif;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    /* Official PDF Contact Footer */
    .site-footer {
      background: var(--forest);
      color: #D2D9CC;
      border-top: 2px solid var(--gold);
      padding: 28px 18px calc(env(safe-area-inset-bottom, 0px) + 32px);
      text-align: center;
      font-size: 12.5px;
    }

    .footer-contacts {
      max-width: 680px;
      margin: 0 auto 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 14px 28px;
      padding-bottom: 18px;
      border-bottom: 1px solid rgba(212, 176, 106, 0.25);
    }

    .footer-contacts a {
      color: #F6F1E6;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .footer-contacts a svg {
      width: 15px;
      height: 15px;
      fill: var(--gold-bright);
    }

    .legal-note {
      color: #95A08F;
      font-size: 11.5px;
      letter-spacing: 0.06em;
    }

    /* Lightbox Modal */
    .lb {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(11, 18, 12, 0.94);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      cursor: zoom-out;
    }

    .lb[hidden] {
      display: none;
    }

    .lb img {
      width: min(88vw, 360px);
      height: min(88vw, 360px);
      object-fit: cover;
      border-radius: 6px;
      border: 2px solid var(--gold-bright);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .lb-title {
      margin: 16px 0 4px;
      color: #F6F1E6;
      font: 600 26px 'Cormorant Garamond', Georgia, serif;
    }

    .lb-price {
      color: var(--gold-bright);
      font: 500 14px 'Jost', sans-serif;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>

  <header class="site-header">
    <button class="theme-toggle" id="themeBtn" type="button" aria-label="Toggle color theme">Lounge Mode</button>

    <!-- Crisp Vector Recreation of the Maraluxe Lotus-M Emblem -->

  </header>

  <nav class="sticky-nav" aria-label="Menu categories">
    <div class="nav-inner">
      <div class="search-wrap">
        <input id="q" type="search" placeholder="Search cocktails, single malts, wines…" autocomplete="off" aria-label="Search menu">

      <div id="chips"></div>

  </nav>

  <div class="page-frame">
    <div class="ornate-sheet">
      <main class="ornate-inner" id="m"></main>
    </div>
  </div>

  <footer class="site-footer">
    <div class="footer-contacts">

  <div class="lb" id="lb" hidden>
    <img id="lbi" alt="">
    <p class="lb-title" id="lbt"></p>
    <span class="lb-price" id="lbp"></span>

<script>
const MENUS = {
  bar: {
    kicker: "Bar & Lounge Menu",
    placeholder: "Search cocktails, single malts, wines…",
    legal: "All prices are in Kenyan Shillings (Ksh.) · Please enjoy responsibly (18+)",
    groups: [
      {
        "name": "Cocktails",
        "hidden": false,
        "categories": [
          {
            "name": "Signature Cocktails",
            "items": [
              {
                "name": "Maraluxe Coconut Velvet",

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;"}[c]));
const fix = s => s.replace(/'/g, "’");
const fmt = n => "Ksh. " + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");

let activeMode = "bar";
const imgs = [];
let obs;

function matchesQuery(item, q) {
  if (!q) return true;
  const hay = (item.name + " " + (item.description || "") + " " + (item.tags || []).join(" ")).toLowerCase();
  return hay.includes(q);
}

function countMatchesInMode(modeKey, q) {
  if (!q) return 0;
  let total = 0;
  MENUS[modeKey].groups.filter(g => !g.hidden).forEach(g => {
    g.categories.forEach(c => {
      c.items.forEach(i => {
        if (matchesQuery(i, q)) total++;
      });
    });
  });
  return total;
}

function renderItem(i) {
  const tags = (i.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  const ds = i.description ? `<div class="ds">${esc(fix(i.description))}</div>` : "";
  const pr = i.options.map(o =>
    `<span class="pr-row">${o.label ? `<span class="pr-label">${esc(o.label)}</span>` : ""}<b class="pr-val">${fmt(o.price)}</b></span>`
  ).join("");
  const k = i.image ? imgs.push(i) - 1 : -1;
  const im = i.image ? `<img class="th" src="${i.image.t}" data-k="${k}" alt="${esc(i.name)}">` : "";
  return `<div class="it">
    <div class="it-left">${im}<div class="nm-wrap"><span class="nm">${esc(fix(i.name))}</span>${tags}${ds}</div></div>
    <div class="dots" aria-hidden="true"></div>
    <div class="pr">${pr}</div>
  </div>`;
}

function renderSignatureShowcase(groups) {
  const sigCat = groups.flatMap(g => g.categories).find(c => c.name === "Signature Cocktails");
  if (!sigCat) return "";
  const cards = sigCat.items.map(i => {
    const k = i.image ? imgs.push(i) - 1 : -1;
    const im = i.image ? `<img src="${i.image.t}" alt="${esc(i.name)}">` : "";
    const p = fmt(i.options[0].price);
    return `<div class="sig-card" data-k="${k}">
      ${im}
      <div class="sig-meta">
        <span class="sig-badge">House Signature</span>
        <b class="sig-name">${esc(fix(i.name.replace(/^Maraluxe /, "")))}</b>
        <span class="sig-price">${p}</span>
      </div>
    </div>`;
  }).join("");
  return `<div class="sig-grid">${cards}</div>`;
}

function render(q) {
  const currentMenu = MENUS[activeMode];
  const groups = currentMenu.groups.filter(g => !g.hidden);
  const vis = [];
  imgs.length = 0;

  const html = groups.map(g => {
    const cats = g.categories.map(c => {
      const its = c.items.filter(i => matchesQuery(i, q));
      if (!its.length) return "";
      const isSigShowcase = (!q && activeMode === "bar" && c.name === "Signature Cocktails");
      const showcase = isSigShowcase ? renderSignatureShowcase(groups) : "";
      const rows = isSigShowcase ? "" : its.map(renderItem).join("");
      const note = c.note ? `<p class="cat-note">${esc(c.note)}</p>` : "";
      return `<div class="cat-banner"><span>${esc(c.name)}</span><span class="currency-hint">KSH</span></div>${note}${showcase}${rows}`;
    }).join("");

    if (!cats) return "";
    vis.push(g);
    return `<section class="grp" id="g-${slug(g.name)}">
      <div class="grp-header">
        <h2 class="g">${esc(g.name)}</h2>
        <div class="grp-rule"></div>
      </div>
      ${cats}
    </section>`;
  }).join("");

  if (html) {
    $("m").innerHTML = html;
  } else {
    const otherMode = activeMode === "bar" ? "food" : "bar";
    const otherLabel = otherMode === "food" ? "Restaurant Menu" : "Bar & Lounge Menu";
    const otherCount = countMatchesInMode(otherMode, q);
    const switchPrompt = otherCount > 0
      ? `<div><button type="button" class="cross-switch-btn" data-switch="${otherMode}">View ${otherCount} match${otherCount > 1 ? "es" : ""} in ${otherLabel}</button></div>`
      : "";
    $("m").innerHTML = `<div class="none">No items in ${esc(currentMenu.kicker)} match “${esc(q)}”.${switchPrompt}</div>`;
  }

  $("chips").innerHTML = vis.map((g, idx) =>
    `<button class="${idx === 0 ? "on" : ""}" data-g="g-${slug(g.name)}">${esc(g.name)}</button>`
  ).join("");

  if (obs) obs.disconnect();
  obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        document.querySelectorAll("#chips button").forEach(b => {
          const on = b.dataset.g === e.target.id;
          b.classList.toggle("on", on);
          if (on) b.scrollIntoView({inline: "center", block: "nearest"});
        });
      }
    });
  }, {rootMargin: "-145px 0px -65% 0px"});

  document.querySelectorAll("section.grp").forEach(s => obs.observe(s));
}

function setMode(mode, preserveQuery = false) {
  if (!MENUS[mode]) return;
  activeMode = mode;
  const cfg = MENUS[mode];

  $("tabBar").classList.toggle("active", mode === "bar");
  $("tabBar").setAttribute("aria-selected", mode === "bar" ? "true" : "false");
  $("tabFood").classList.toggle("active", mode === "food");
  $("tabFood").setAttribute("aria-selected", mode === "food" ? "true" : "false");

  $("menuKicker").textContent = cfg.kicker;
  $("q").placeholder = cfg.placeholder;
  $("legalNote").textContent = cfg.legal;

  if (!preserveQuery) {
    $("q").value = "";
  }
  render($("q").value.trim().toLowerCase());
  window.scrollTo({top: 0, behavior: "smooth"});
}

document.querySelectorAll(".mode-btn").forEach(btn => {
  btn.addEventListener("click", () => setMode(btn.dataset.mode, false));
});

$("chips").addEventListener("click", e => {
  const b = e.target.closest("button");
  if (!b) return;
  const target = $(b.dataset.g);
  if (target) target.scrollIntoView({behavior: "smooth"});
});

$("q").addEventListener("input", e => render(e.target.value.trim().toLowerCase()));

$("m").addEventListener("click", e => {
  const switchBtn = e.target.closest("[data-switch]");
  if (switchBtn) {
    setMode(switchBtn.dataset.switch, true);
    return;
  }
  const trigger = e.target.closest("[data-k]");
  if (!trigger) return;
  const i = imgs[trigger.dataset.k];
  if (!i || !i.image) return;
  $("lbi").src = i.image.f || i.image.t;
  $("lbt").textContent = fix(i.name);
  $("lbp").textContent = fmt(i.options[0].price);
  $("lb").hidden = false;
});

$("lb").addEventListener("click", () => {
  $("lb").hidden = true;
});

$("themeBtn").addEventListener("click", () => {
  const root = document.documentElement;
  const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
  root.setAttribute("data-theme", next);
  $("themeBtn").textContent = next === "dark" ? "Paper Mode" : "Lounge Mode";
});

// Support direct deep-linking via ?menu=food or #food
if (location.hash === "#food" || new URLSearchParams(location.search).get("menu") === "food") {
  setMode("food");
} else {
  render("");
}
</script>
