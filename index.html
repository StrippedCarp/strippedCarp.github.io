<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131B0E">
<title>Maraluxe Resort and Spa — Bar Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E6;--ink:#1E2A1B;--muted:#6B7466;--line:#DCD3BE;--gold:#8E6A2B;--hd:#131B0E;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101810;--ink:#EFE8D6;--muted:#A3AC98;--line:#2A3524;--gold:#D4B06A;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101810;--ink:#EFE8D6;--muted:#A3AC98;--line:#2A3524;--gold:#D4B06A;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 112px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 Jost,system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
header{background:var(--hd);text-align:center;padding:14px 16px 10px}
.logo{width:min(80%,290px);height:auto;display:block;margin:0 auto;-webkit-mask-image:radial-gradient(ellipse at center,#000 60%,transparent 100%);mask-image:radial-gradient(ellipse at center,#000 60%,transparent 100%)}
.k{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 0;color:#D4B06A;font:600 12px Jost,sans-serif;letter-spacing:.32em;text-transform:uppercase}.k::before,.k::after{content:"";width:34px;height:1px;background:#D4B06A;opacity:.6}
.s{margin:4px 0 0;color:#A3AC98;font-size:12px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--hd);padding:8px 12px 10px;border-bottom:1px solid #2A3524}
#q{width:100%;padding:10px 14px;border-radius:10px;border:1px solid #3A4630;background:#1B2514;color:#EFE8D6;font:inherit;font-size:15px}
#q::placeholder{color:#8B9580}
#chips{display:flex;gap:8px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;padding:7px 14px;border-radius:99px;border:1px solid #3A4630;background:transparent;color:#CFD6C3;font:500 13px Jost,sans-serif;letter-spacing:.04em;cursor:pointer}
#chips button.on{background:#D4B06A;border-color:#D4B06A;color:#131B0E}
main{max-width:720px;margin:0 auto;padding:6px 18px 24px}
h2.g{font:600 34px/1.1 "Cormorant Garamond",Georgia,serif;color:var(--gold);margin:36px 0 2px}
h3.c{display:flex;align-items:center;gap:12px;margin:22px 0 4px;color:var(--muted);font:600 11.5px Jost,sans-serif;letter-spacing:.24em;text-transform:uppercase}
h3.c::after{content:"";flex:1;height:1px;background:var(--line)}
.it{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--line)}
.nm{font-weight:500}
.tag{display:inline-block;margin-left:8px;padding:1px 8px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:10px;letter-spacing:.14em;text-transform:uppercase;vertical-align:2px}
.ds{margin-top:2px;color:var(--muted);font-size:13.5px}
.pr{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.pr div{display:flex;justify-content:flex-end;gap:14px}
.pr span{color:var(--muted);font-size:13px}
.pr b{font-weight:500;min-width:4.2em;text-align:right}
.it .l{display:flex;align-items:center;flex:1;min-width:0}.th{flex:none;width:64px;height:64px;margin-right:13px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}.th.z{cursor:zoom-in}
.lb{position:fixed;inset:0;z-index:30;background:rgba(10,14,8,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}.lb[hidden]{display:none}.lb img{max-width:100%;max-height:72vh;border-radius:14px}.lb p{margin:14px 0 0;color:#EFE8D6;font:600 26px "Cormorant Garamond",Georgia,serif}
.sub{margin:0 0 4px;color:var(--muted);font-size:14px}.fs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:10px -18px 0;padding:4px 18px 8px;scrollbar-width:none}.fs::-webkit-scrollbar{display:none}.fc{flex:none;width:152px;scroll-snap-align:start;text-align:center;padding:18px 10px 14px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(180deg,rgba(212,176,106,.14),transparent)}.fc img{width:92px;height:92px;margin:0 auto 12px;display:block;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}.fc b{display:block;font:600 21px/1.1 "Cormorant Garamond",Georgia,serif}.fc small{display:block;margin-top:5px;color:var(--muted);font-size:10px;letter-spacing:.2em;text-transform:uppercase}.fc span{display:block;margin-top:6px;color:var(--gold);font-weight:500}
.none{padding:40px 0;text-align:center;color:var(--muted)}
footer{padding:8px 24px 36px;text-align:center;color:var(--muted);font-size:12.5px}
.gate{position:fixed;inset:0;z-index:20;background:var(--hd);color:#EFE8D6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
.gate[hidden]{display:none}
.gate h1{margin:18px 0 6px;font:600 34px "Cormorant Garamond",Georgia,serif;color:#D4B06A}
.gate p{margin:0 0 22px;color:#B8C0AC;max-width:300px}
.gate button{display:block;width:230px;margin:0 auto 10px;padding:13px;border-radius:99px;font:500 15px Jost,sans-serif;cursor:pointer}
.gate .y{background:#D4B06A;border:0;color:#131B0E}
.gate .n{background:transparent;border:1px solid #3A4630;color:#CFD6C3}
</style>
</head>
<body>
<div class="gate" id="gate">
  <img class="logo" alt="Maraluxe Resort and Spa">
  <h1>Welcome</h1>
  <p id="gp">Our bar menu is for guests aged 18 and over. Please confirm to continue.</p>
  <div id="gb"><button class="y" id="yes">I’m 18 or over</button><button class="n" id="no">Not yet</button></div>
</div>
<header>
  <img class="logo" alt="Maraluxe Resort and Spa">
  <p class="k">Bar Menu</p>
  <p class="s">Crafted cocktails · Fine spirits · Ice-cold beer</p>
  <p class="s">All prices in Ksh.</p>
</header>
<nav>
  <input id="q" type="search" placeholder="Search drinks…" autocomplete="off" aria-label="Search drinks">
  <div id="chips"></div>
</nav>
<main id="m"></main>
<footer>Please drink responsibly. Alcohol is for guests aged 18 and over.</footer>
<div class="lb" id="lb" hidden><img id="lbi" alt=""><p id="lbt"></p></div>

  const ds=i.description?`<div class="ds">${esc(i.description)}</div>`:"";
  const pr=i.options.map(o=>`<div>${o.label?`<span>${esc(o.label)}</span>`:""}<b>${fmt(o.price)}</b></div>`).join("");
  const k=i.image?imgs.push(i)-1:-1;
  const im=i.image?`<img class="th${i.image.f?" z":""}" src="${i.image.t}" data-k="${k}" alt="${esc(i.name)}">`:"";
  return `<div class="it"><div class="l">${im}<div class="nm">${esc(fix(i.name))}${tags}${ds}</div></div><div class="pr">${pr}</div></div>`;
}
function feat(){
  const c=groups.flatMap(g=>g.categories).find(c=>c.name==="Signature Cocktails");
  if(!c)return "";
  const cards=c.items.map(i=>{
    const k=i.image?imgs.push(i)-1:-1;
    const im=i.image?`<img class="th${i.image.f?" z":""}" src="${i.image.t}" data-k="${k}" alt="${esc(i.name)}">`:"";
    const p=i.options.length>1?"from "+fmt(i.options[0].price):fmt(i.options[0].price);
    return `<div class="fc">${im}<b>${esc(fix(i.name.replace(/^Maraluxe /,"")))}</b><small>Signature</small><span>${p}</span></div>`;
  }).join("");
  return `<section class="grp" id="g-signature"><h2 class="g">Signature Cocktails</h2><p class="sub">Crafted in-house at Maraluxe</p><div class="fs">${cards}</div></section>`;
}
function render(q){
  const vis=[];imgs.length=0;const fh=q?"":feat();if(fh)vis.push({name:"Signature"});
  const html=groups.map(g=>{
    const cats=g.categories.map(c=>{
      const its=(!q&&c.name==="Signature Cocktails")?[]:c.items.filter(i=>!q||i.name.toLowerCase().includes(q));
      return its.length?`<h3 class="c">${esc(c.name)}</h3>${its.map(item).join("")}`:"";
    }).join("");
    if(!cats)return "";
    vis.push(g);
    return `<section class="grp" id="g-${slug(g.name)}"><h2 class="g">${esc(g.name)}</h2>${cats}</section>`;
  }).join("");
  $("m").innerHTML=fh+html||`<div class="none">No drinks match “${esc(q)}”.</div>`;
  $("chips").innerHTML=vis.map(g=>`<button data-g="g-${slug(g.name)}">${esc(g.name)}</button>`).join("");
  if(obs)obs.disconnect();
  obs=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){
      document.querySelectorAll("#chips button").forEach(b=>{
        const on=b.dataset.g===e.target.id;b.classList.toggle("on",on);
        if(on)b.scrollIntoView({inline:"center",block:"nearest"});
      });
    }
  }),{rootMargin:"-130px 0px -65% 0px"});
  document.querySelectorAll("section.grp").forEach(s=>obs.observe(s));
}
$("chips").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  $(b.dataset.g).scrollIntoView({behavior:"smooth"});
});
$("q").addEventListener("input",e=>render(e.target.value.trim().toLowerCase()));
$("m").addEventListener("click",e=>{
  const t=e.target.closest(".th.z");if(!t)return;
  const i=imgs[t.dataset.k];$("lbi").src=i.image.f;$("lbt").textContent=fix(i.name);$("lb").hidden=false;
});
$("lb").onclick=()=>{$("lb").hidden=true};
render("");
let ok=false;
try{ok=sessionStorage.getItem("mx18")==="1"}catch(e){}
if(ok)$("gate").hidden=true;
$("yes").onclick=()=>{try{sessionStorage.setItem("mx18","1")}catch(e){}$("gate").hidden=true};
$("no").onclick=()=>{$("gp").textContent="No problem. Please ask our team about our restaurant menu and soft drinks.";$("gb").hidden=true};
</script>
</body>
