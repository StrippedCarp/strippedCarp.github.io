<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#131B0E">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none';">
  <meta name="description" content="Maraluxe Resort and Spa bar menu featuring crafted cocktails, fine spirits, ice-cold beer, and luxury wines.">

  <title>Maraluxe Resort and Spa — Bar Menu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- Age Verification Modal -->
  <div class="age-gate" id="ageGateModal" role="dialog" aria-modal="true" aria-labelledby="ageGateTitle">
    <img class="brand-logo" alt="Maraluxe Resort and Spa">
    <h1 class="age-gate__title" id="ageGateTitle">Welcome</h1>
    <p class="age-gate__message" id="ageGatePrompt">Our bar menu is for guests aged 18 and over. Please confirm to continue.</p>
    <div id="ageGateActions">
      <button type="button" class="age-gate__btn age-gate__btn--confirm" id="confirmAgeBtn">I’m 18 or over</button>
      <button type="button" class="age-gate__btn age-gate__btn--decline" id="declineAgeBtn">Not yet</button>
    </div>
  </div>

  <!-- Header -->
  <header class="site-header">
    <img class="brand-logo" alt="Maraluxe Resort and Spa">
    <p class="site-header__kicker">Bar Menu</p>
    <p class="site-header__subtitle">Crafted cocktails · Fine spirits · Ice-cold beer</p>
    <p class="site-header__subtitle">All prices in Ksh.</p>
  </header>

  <!-- Sticky Menu Navigation & Search -->
  <nav class="menu-nav" aria-label="Menu filter navigation">
    <input
      id="searchInput"
      class="menu-nav__search"
      type="search"
      maxlength="60"
      placeholder="Search drinks…"
      autocomplete="off"
      aria-label="Search drinks"
    >
    <div id="categoryPills" class="category-pills"></div>
  </nav>

  <!-- Dynamic Menu Content Container -->
  <main id="menuContent" class="menu-container"></main>

  <!-- Responsible Drinking Footer -->
  <footer class="site-footer">
    Please drink responsibly. Alcohol is for guests aged 18 and over.
  </footer>

  <!-- Lightbox Modal for Image Zoom -->
  <div class="lightbox-modal" id="lightboxModal" role="dialog" aria-modal="true" hidden>
    <img class="lightbox-modal__img" id="lightboxImage" alt="">
    <p class="lightbox-modal__caption" id="lightboxCaption"></p>
  </div>

  <!-- Application Scripts -->
  <script src="./assets.js" defer></script>
  <script src="./menu-data.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
